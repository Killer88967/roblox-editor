name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roblox_editor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/roblox_editor
    steps:
      - uses: actions/checkout@v4
        with:
          # On PRs, check out the branch itself so a rebuilt WASM package can be pushed back.
          ref: ${{ github.head_ref || github.ref }}

      # Toolchain, components and the wasm32 target come from rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # zstd-sys (used by rbx_binary) compiles C code, which needs clang for wasm32.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Rust tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Also generates the Prisma client (web's postinstall).
      - run: pnpm install --frozen-lockfile

      # Apply the migrations to a fresh database, then fail if they don't produce exactly
      # what prisma/schema.prisma describes (a schema change without a migration).
      - name: Check database migrations
        working-directory: apps/web
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Build WASM package
        run: pnpm --filter @rbxe/wasm build

      # `next typegen` generates route types (e.g. LayoutProps) that tsc needs.
      - name: Typecheck web app
        run: pnpm --filter web exec next typegen && pnpm --filter web exec tsc --noEmit

      - name: Lint web app
        run: pnpm --filter web lint

      - name: Build web app
        run: pnpm --filter web build

      # The built WASM package is committed (the web deploy uses it as-is), so keep it
      # in sync with the Rust code on PR branches from this repo.
      - name: Commit rebuilt WASM package
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -n "$(git status --porcelain packages/wasm/pkg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add packages/wasm/pkg
            git commit -m "chore: rebuild WASM package"
            git push
          else
            echo "WASM package already up to date"
          fi
