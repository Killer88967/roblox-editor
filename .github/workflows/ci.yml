name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # On PRs, check out the branch itself so a rebuilt WASM package can be pushed back.
          ref: ${{ github.head_ref || github.ref }}

      # Toolchain, components and the wasm32 target come from rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # zstd-sys (used by rbx_binary) compiles C code, which needs clang for wasm32.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Rust tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build WASM package
        run: pnpm --filter @rbxe/wasm build

      - name: Typecheck web app
        run: pnpm --filter web exec tsc --noEmit

      - name: Lint web app
        run: pnpm --filter web lint

      - name: Build web app
        run: pnpm --filter web build

      # The built WASM package is committed (the web deploy uses it as-is), so keep it
      # in sync with the Rust code on PR branches from this repo.
      - name: Commit rebuilt WASM package
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -n "$(git status --porcelain packages/wasm/pkg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add packages/wasm/pkg
            git commit -m "chore: rebuild WASM package"
            git push
          else
            echo "WASM package already up to date"
          fi
