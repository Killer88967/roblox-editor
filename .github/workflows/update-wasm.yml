
name: Update WASM Package

on:
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "packages/wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-wasm-package
  cancel-in-progress: false

jobs:
  build:
    name: Build WASM Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            packages/wasm/pkg/**
          branch: automation/update-wasm-pkg
          delete-branch: true
          commit-message: "chore(wasm): update generated package"
          title: "chore(wasm): update generated package"
          body: |
            ## Automated WASM Package Update

            This PR contains the latest generated WASM package.

            ### Changes
            - Rebuilt the WASM package using `wasm-pack`.
            - Updated generated JavaScript bindings.
            - Updated TypeScript declarations.
            - Updated the compiled WASM binary.

            ### Verification
            - [x] `pnpm install --frozen-lockfile`
            - [x] `pnpm build`

            Automatically generated by GitHub Actions.
          base: main